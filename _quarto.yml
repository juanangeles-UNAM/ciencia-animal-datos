project:
  type: book
  output-dir: _book

book:
  title: "Ciencia Animal a través de los Datos"
  subtitle: "Exploración, análisis y razonamiento estadístico con R"
  author: "Dr. Juan Carlos Ángeles Hernández"
  description: "Material didáctico de exploración, análisis y razonamiento estadístico con R aplicado a Ciencia Animal"
  site-url: "https://juanangeles-UNAM.github.io/ciencia-animal-datos/"

  chapters:
    - index.qmd
    - part: "Sección I · Primer encuentro con los datos"
      chapters:
        - Capitulo-01.qmd
        - Capitulo-02.qmd
        - recursos.qmd

  page-footer:
    center: "Dr. Juan Carlos Ángeles Hernández · Departamento de Medicina y Zootecnia de Rumiantes · FMVZ–UNAM"

  search: true
  repo-url: "https://github.com/juanangeles-UNAM/ciencia-animal-datos"
  repo-actions: [edit, issue]
  # downloads: [pdf]

bibliography: references.bib

format:
  html:
    lang: es
    theme: cosmo
    css: assets/style.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-fold: false
    smooth-scroll: true
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true

execute:
  echo: true
  warning: false
  message: false
